# Publish prebuilt QuoxCORE images to GHCR on a release tag.
#
# DISABLED BY DEFAULT. Every job is guarded by the repository variable
# QUOX_PUBLISH_IMAGES == 'true' (Settings > Secrets and variables > Actions >
# Variables). Until the owner sets it, a tag push runs this workflow and every
# job is skipped. See docs/RELEASE_PUBLIC_MIRROR.md in the private repo.
#
# Image names: ghcr.io/quoxai/quoxcore-<service>:<tag> and :latest, where <tag>
# is the release tag (for example v4.2.0). scripts/setup.sh pulls these first
# and builds locally only when the pull fails.
name: images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/quoxai

jobs:
  publish:
    if: ${{ vars.QUOX_PUBLISH_IMAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: dashboard,    context: '.',                      dockerfile: Dockerfile }
          - { service: auth,         context: '.',                      dockerfile: services/auth/Dockerfile }
          - { service: collector,    context: '.',                      dockerfile: services/collector/Dockerfile }
          - { service: files,        context: services/files,           dockerfile: services/files/Dockerfile }
          - { service: tasks,        context: services/tasks,           dockerfile: services/tasks/Dockerfile }
          - { service: orchestrator, context: services/orchestrator,    dockerfile: services/orchestrator/Dockerfile }
          - { service: memory,       context: services/memory,          dockerfile: services/memory/Dockerfile }
          - { service: quoxbrain,    context: services/quoxbrain,       dockerfile: services/quoxbrain/Dockerfile }
          - { service: quoxflow,     context: quoxflow,                 dockerfile: quoxflow/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Z2H-AGENTINST: public installs enrol hosts through the collector's GET /install and
      # /download/quoxagent-*, which serve from /app/quoxagent-release. Stage the signed
      # quoxagent release pinned in scripts/release/quoxagent/quoxagent-release.json (assets
      # on this repo's quoxagent-<version> release; the source stays private). The script
      # verifies the Ed25519 signature and every pinned SHA-256 and fails the build on any
      # mismatch, so an image never ships an unverified or missing agent.
      - name: Stage the signed quoxagent release (collector only)
        if: ${{ matrix.service == 'collector' }}
        run: node scripts/release/quoxagent/fetch-quoxagent-release.mjs services/collector/quoxagent-release

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            QUOXCORE_VERSION=${{ steps.v.outputs.version }}
            DOCKER_GID=988
            INCLUDE_CLAUDE_CLI=false
          tags: |
            ${{ env.REGISTRY }}/quoxcore-${{ matrix.service }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/quoxcore-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  smoke:
    # Pull exactly what was published and prove the stack comes up healthy.
    needs: publish
    if: ${{ vars.QUOX_PUBLISH_IMAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the published images
        env:
          QUOX_IMAGE_TAG: ${{ github.ref_name }}
          COMPOSE_FILE: docker-compose.yml:docker-compose.nomatrix.yml:docker-compose.images.yml
        run: |
          docker compose pull dashboard auth files collector tasks orchestrator memory quoxbrain quoxflow

      - name: Start the stack from the pulled images and check health
        env:
          QUOX_IMAGE_TAG: ${{ github.ref_name }}
          COMPOSE_FILE: docker-compose.yml:docker-compose.nomatrix.yml:docker-compose.images.yml
        run: |
          set -euo pipefail
          bash scripts/generate-secrets.sh >/dev/null
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3101/health >/dev/null 2>&1; then echo "auth healthy"; break; fi
            sleep 5
            [ "$i" = 60 ] && { docker compose ps; docker compose logs --tail=50; exit 1; }
          done
          docker compose ps

      - name: Tear down
        if: always()
        run: docker compose down -v
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.nomatrix.yml:docker-compose.images.yml
