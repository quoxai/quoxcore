# QuoxCORE Nginx Configuration — HTTPS-First
# Processed by envsubst at container start for: ${QDRANT_API_KEY}, ${DASHBOARD_PORT}, ${INTERNAL_SERVICE_KEY}, ${BASTION_URL}, ${GRAFANA_URL}
#
# Internal ports:
#   443 — HTTPS (main traffic, all routes)
#    80 — HTTP redirect to HTTPS + health check for Docker

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# quox#782: chat access log line with the query string stripped ($uri, never
# $request / $request_uri), so a legacy GET /chat/stream?prompt=... cannot
# leak prompt text into the log. POST /chat/stream carries the prompt in the body.
log_format chat_redacted '$remote_addr - $remote_user [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

# Upgrade-aware Connection header for the /collector/ catch-all. The block
# previously hardcoded `Connection 'upgrade'` on EVERY proxied request, which
# poisons upstream keepalive sockets when ordinary HTTP shares the location
# with SSE/WebSocket traffic and degrades the proxy to multi-second latencies
# over hours (observed 4.7s for a 22ms endpoint, recurring after restart).
# Non-upgrade requests now close cleanly instead.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Map optional services — NONE means unconfigured (envsubst replaces these)
map "${GRAFANA_URL}" $grafana_configured {
    "NONE"   0;
    ""       0;
    default  1;
}

# ============================================
# HTTP server — redirect to HTTPS
# ============================================
server {
    listen 80;
    server_name _;

    # Docker health check (plain HTTP, internal only)
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"dashboard"}';
        add_header Content-Type application/json;
    }

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS on the dashboard port
    location / {
        return 301 https://$host:${DASHBOARD_PORT}$request_uri;
    }
}

# ============================================
# HTTPS server — main application
# ============================================
server {
    listen 443 ssl;
    # HTTP/2: multiplex all requests (including the inbox SSE streams) over ONE
    # connection. Without it, HTTP/1.1 caps the browser at ~6 connections per
    # host, and the inbox list page's per-org SSE fan-out (one EventSource per
    # org) exhausts that pool — starving the list fetches AND the inline
    # approve POST (which then hangs to its 12s abort and reverts). The item
    # detail page opens no SSE, so its approve worked. HTTP/2 removes the cap.
    # (nginx 1.25.1+ syntax; separate directive, not the deprecated `listen
    # ... http2`.)
    http2 on;
    server_name _;

    # Prevent nginx from rewriting redirect URLs with its internal port (443)
    # when the external port differs (e.g. Docker maps 3000->443)
    absolute_redirect off;

    ssl_certificate /etc/nginx/ssl/quox.crt;
    ssl_certificate_key /etc/nginx/ssl/quox.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Resolver for variable-based proxy_pass. Docker DNS ONLY: every variable
    # upstream here is either a compose service name (screencap, quoxbrain),
    # which only 127.0.0.11 can resolve, or a raw IP (grafana), which needs no
    # resolver at all. A public fallback (8.8.8.8 until 2026-08-25) NXDOMAINs
    # on service names, so nginx intermittently answered 502 "Host not found"
    # on /api/quoxbrain/* whenever the fallback won the query (BRAIN2 P1a).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Variables for optional external services (set by envsubst, default NONE)
    set $grafana_backend "${GRAFANA_URL}";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    # nginx does not inherit add_header into a location block that declares
    # its own add_header. Every location below that sets its own headers
    # repeats this full set on purpose. Any NEW location that adds an
    # add_header line must repeat these six too, or it silently drops them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Allow microphone for voice features (WebRTC requires secure context)
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }

    # ==========================================
    # Health check
    # ==========================================
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"dashboard","ssl":true}';
        add_header Content-Type application/json;
    }

    # ==========================================
    # Voice endpoints → collector
    # ==========================================
    location /webhook/voice-status {
        proxy_pass http://collector:9848/voice/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /webhook/speak {
        limit_req zone=webhook_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://collector:9848/voice/speak;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /webhook/transcribe {
        limit_req zone=webhook_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://collector:9848/voice/transcribe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25m;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ==========================================
    # Quox Voice — LiveKit signalling (QUOX-VOICE P4)
    # Folds the realtime-voice media SIGNAL onto the dashboard's own TLS
    # origin so it inherits this install's cert (self-signed or the operator's
    # real cert), instead of a parallel :8443 origin with its own cert. The
    # browser plugin connects to wss://<this-origin>/quox-voice (livekit-client
    # then appends /rtc), and this proxies the websocket to the LiveKit server
    # on the host. Media (RTP/UDP) still flows browser↔host directly via
    # LiveKit's advertised node-ip; TURN-on-this-origin for NAT'd clients is
    # the follow-on. LiveKit host address is fixed here; a compose-service
    # LiveKit (reached by service name) is the later hardening.
    location /quox-voice/rtc {
        proxy_pass http://host.docker.internal:7880/rtc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # ==========================================
    # Telegram Inbound Webhook → collector
    # Supports multi-bot routing: /webhook/telegram/ and /webhook/telegram/{botId}
    # ==========================================
    location /webhook/telegram/ {
        limit_req zone=webhook_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://collector:9848/webhook/telegram/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # ==========================================
    # Collector (chat streaming, fleet mgmt)
    # ==========================================

    # Chat/claude endpoint — needs higher timeout for CLI path (OAuth, ~30-120s typical)
    location /collector/chat/claude {
        proxy_pass http://collector:9848/chat/claude;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # SSE endpoint for chat streaming (must come before general /collector/)
    location /collector/chat/stream {
        access_log /var/log/nginx/access.log chat_redacted;
        proxy_pass http://collector:9848/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_pass_header X-Accel-Buffering;

        proxy_read_timeout 1800s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Connection '';
    }

    # Mock SSE endpoint for testing
    location /collector/chat/stream-mock {
        proxy_pass http://collector:9848/chat/stream-mock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
    }

    # WebSocket endpoint for collector
    location /collector/ws {
        proxy_pass http://collector:9848/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Terminal WebSocket (Phase 1 — web terminal for CLI auth)
    location /collector/terminal/ws {
        proxy_pass http://collector:9848/terminal/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Shell WebSocket (host-aware interactive terminal — premium plugin)
    location /collector/terminal/shell/ws {
        proxy_pass http://collector:9848/terminal/shell/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Customer-facing collector paths use a variable upstream so nginx
    # re-resolves `collector` via the Docker resolver (valid=30s). A static
    # proxy_pass pins the IP at config load; when the collector container is
    # recreated with a new IP every customer widget 502s until nginx reloads
    # (QC brutaloop wave 12: 30+ minutes of 502 on dev).
    # QCL-2: public QuoxChat widget endpoint (widget.js / config / message SSE).
    # Exact match so the static `~* \.(js|css|...)$` regex location does NOT
    # steal /quoxchat/widget.js. Collector serves it anonymously (default-deny
    # allowlists /quoxchat/*) and sets its own CORS; per-widget domainGuard
    # enforces allowed_domains.
    location = /quoxchat/widget.js {
        set $collector_up "http://collector:9848";
        proxy_pass $collector_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Collector-owned QuoxChat API segments, enumerated so the SPA keeps the
    # rest of /quoxchat/* (the operator views: /quoxchat and /quoxchat/:id
    # previously returned the collector's "Cannot GET" on hard refresh). Every
    # path shipped in customer embed snippets stays proxied. New collector
    # first-segments under /quoxchat/ must be added here.
    location ~ ^/quoxchat/(config|health|knowledge|poll|session|message|simulate|transcript|visitor|feedback|first-seen|events|teach|internal|conversation|handoff-state)(/|$) {
        set $collector_up "http://collector:9848";
        proxy_pass $collector_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming for /quoxchat/message
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_pass_header X-Accel-Buffering;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Connection '';

        client_max_body_size 25m;
    }

    # General collector API
    location /collector/quoxchat/knowledge/ {
        set $collector_up "http://collector:9848";
        rewrite ^/collector/(.*) /$1 break;
        proxy_pass $collector_up;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25m;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # X-PLUGIN P10: browser media upload for X posts. The app enforces the
    # real per-type caps (5MB image, 15MB GIF, 64MB video); this limit only
    # needs to not veto the app's own, with multipart overhead. Scoped to the
    # one upload route so the rest of the collector proxy keeps the default.
    # Without this, nginx's 1m default answered uploads with an HTML 413 that
    # never reached the collector (owner hit it 2026-09-16).
    location = /collector/x/media {
        proxy_pass http://collector:9848/x/media;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 72m;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # NOTESQ import (AQ-9D P7): .enex / vault zip uploads up to 100 MB. The
    # /collector/ default (1m) would answer an HTML 413 that never reaches the
    # collector. Exact match: only the POST upload path, polling uses /collector/.
    location = /collector/api/v1/notesq/import {
        proxy_pass http://collector:9848/api/v1/notesq/import;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100m;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /collector/ {
        set $collector_up "http://collector:9848";
        rewrite ^/collector/(.*) /$1 break;
        proxy_pass $collector_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # MATRIX-P4a: Matrix (Synapse) homeserver — matrix-js-sdk polls /sync over
    # plain HTTP (long-poll), no WebSocket upgrade needed yet.
    #
    # OPTIONAL upstream (quox#801): the Matrix stack is a separate compose
    # project and is absent on a fresh machine. A static
    # `proxy_pass http://quox-matrix-synapse:8008/` makes nginx resolve the host at
    # config-load; with no such container it dies with `host not found in
    # upstream` and the dashboard crash-loops. Variable proxy_pass defers DNS to
    # request time via the Docker `resolver` above; absent Matrix yields a clean
    # 503 per request. Variable proxy_pass does not rewrite the URI, so the
    # /matrix/ prefix is stripped explicitly (query string is preserved).
    location /matrix/ {
        set $matrix_backend "http://quox-matrix-synapse:8008";
        rewrite ^/matrix/(.*) /$1 break;
        proxy_pass $matrix_backend;
        error_page 502 503 504 = @matrix_absent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location @matrix_absent {
        default_type application/json;
        return 503 '{"error":"matrix_unavailable","message":"The Matrix stack is not running on this install."}';
    }

    # Agent proxy (via collector)
    location /agent/ {
        proxy_pass http://collector:9848/agent/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ==========================================
    # MHA Agent (host network)
    # ==========================================
    location /mha-agent/ws/ {
        proxy_pass http://172.18.0.1:9847/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /mha-agent/ {
        proxy_pass http://172.18.0.1:9847/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ==========================================
    # Files service
    # ==========================================
    # Exact match: /files is the SPA route
    location = /files {
        try_files /index.html =404;
    }
    # F01 stopgap (engagement trust-proof-isolation-sweep-c1): edge auth gate for
    # the legacy, un-tenanted /files/ store, which otherwise serves/deletes ANY
    # tenant's files with no auth. This only requires a valid session; it does
    # NOT enforce per-org ownership (the files service has no org model). The real
    # fix is the org-scoped file-store migration, after which this gate and the
    # legacy /files*/ locations are removed.
    location = /__files_authcheck {
        internal;
        proxy_pass http://auth:3101/api/auth/authcheck;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }
    # Dev/runtime compatibility path: preserve /files page route while exposing
    # a distinct API prefix that cannot fall through to the SPA.
    location /files-api/ {
        auth_request /__files_authcheck;   # F01 stopgap: require a valid session
        rewrite ^/files-api/(.*) /$1 break;
        proxy_pass http://files:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location /files/ {
        auth_request /__files_authcheck;   # F01 stopgap: require a valid session
        proxy_pass http://files:3102/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==========================================
    # Auth service API routes
    # ==========================================
    location /api/auth {
        proxy_pass http://auth:3101/api/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /api/auth /api/auth;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # MATRIX-P4a: mints the Matrix (Synapse) JWT SSO token
    location /api/matrix {
        proxy_pass http://auth:3101/api/matrix;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # SSE endpoint for real-time inbox updates — must disable buffering
    location ~ ^/api/orgs/[^/]+/inbox/stream$ {
        proxy_pass http://auth:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    location /api/orgs {
        # NotesQ attachments: auth's file upload route allows 25MB; sit just
        # above it so the app returns its own error instead of nginx's 1MB 413.
        client_max_body_size 26m;
        proxy_pass http://auth:3101/api/orgs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # QUOXIDENTITY P1: attach lease + grant routes live on the auth service.
    # Without this block the /api/agent-attach prefix falls through to the SPA
    # and the quox agent attach CLI (which reaches auth via this edge) 404s,
    # even though the auth container serves the routes correctly on :3101.
    location /api/agent-attach {
        proxy_pass http://auth:3101/api/agent-attach;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/invites {
        proxy_pass http://auth:3101/api/invites;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/mfa {
        proxy_pass http://auth:3101/api/mfa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/admin {
        proxy_pass http://auth:3101/api/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SET-IA Phase 5b: unified provider keys endpoint (auth-gated).
    location /api/keys {
        proxy_pass http://auth:3101/api/keys;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/setup {
        proxy_pass http://auth:3101/api/setup;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users {
        proxy_pass http://auth:3101/api/users;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/notifications {
        proxy_pass http://auth:3101/api/notifications;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/uploads {
        proxy_pass http://auth:3101/api/uploads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5M;
    }

    location ^~ /uploads/ {
        proxy_pass http://auth:3101/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }

    location /api/toolsmith {
        proxy_pass http://auth:3101/api/toolsmith;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        client_max_body_size 5M;
    }

    location /api/tests {
        proxy_pass http://auth:3101/api/tests;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ==========================================
    # Task service (background objectives)
    # ==========================================
    # SSE stream — must disable buffering
    location ~ ^/tasks/(api/objectives/[^/]+/stream)$ {
        proxy_pass http://tasks:3104/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # General task service API
    location /tasks/ {
        proxy_pass http://tasks:3104/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ScreenCap / Browser-Q service — OPTIONAL in the public profile.
    # docker-compose.yml gates screencap behind profiles: ["with-screencap",
    # "full"] (see docker-compose.public.yml / PUBLIC_DEPLOY_RUNBOOK.md
    # trimmed-profile deploys). A static `proxy_pass http://screencap:3300/`
    # forces nginx to resolve that hostname at CONFIG-LOAD time; when the
    # screencap container doesn't exist (public/trimmed profile), Docker's
    # embedded DNS can't resolve it, nginx fails to start, and the dashboard
    # crash-loops (real bug hit on the q01 public deploy). Using a variable
    # for proxy_pass defers the DNS lookup to request time via the `resolver`
    # directive declared above — an absent screencap now yields a 502 per
    # request instead of failing nginx boot. Full-profile behaviour is
    # unchanged: when screencap IS present, it resolves and proxies normally.
    # NOTE: proxy_pass with a variable does NOT rewrite the URI (nginx
    # behaviour), so we must explicitly strip the /screencap/ prefix.
    location /screencap/ {
        set $screencap_backend "http://screencap:3300";
        rewrite ^/screencap/(.*) /$1 break;
        proxy_pass $screencap_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Memory service health (proxied from /api/memory/)
    location /api/memory/ {
        proxy_pass http://memory:3103/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/quoxbrain/ {
        # quoxbrain runs only in full-profile deploys. Use a variable so nginx
        # defers DNS to REQUEST time via the `resolver` above, instead of
        # resolving at config-load and crash-looping when quoxbrain is absent
        # (public/trimmed profile) — the exact bug the /screencap/ block above
        # documents, hit again on the prod public deploy 2026-08-08. Absent
        # quoxbrain now yields a 502 per request, not a failed nginx boot.
        # Variable proxy_pass does NOT rewrite the URI, so strip the prefix.
        set $quoxbrain_backend "http://quoxbrain:3106";
        rewrite ^/api/quoxbrain/(.*) /$1 break;
        proxy_pass $quoxbrain_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==========================================
    # QuoxBastion (SSH gateway)
    # ==========================================
    # /bastion (no trailing slash) is the SPA route. The bastion API itself
    # is reachable ONLY via the collector proxy
    # (/collector/api/v1/bastion/proxy), which enforces the per-tool role
    # scope gate. A direct nginx passthrough to the bastion backend
    # (formerly `location /bastion/ { proxy_pass $bastion_backend; ... }`)
    # let the browser reach the bastion API directly, bypassing the
    # collector's role gate and enabling an X-Actor header spoof — removed
    # as part of the GAP-5 pentest fix.
    location = /bastion {
        try_files /index.html =404;
    }

    # ==========================================
    # Grafana Reverse Proxy (solves mixed-content HTTPS→HTTP)
    # ==========================================
    location ^~ /grafana/ {
        if ($grafana_configured = 0) {
            return 503 '{"error":"Grafana not configured. Set GRAFANA_URL in .env"}';
        }
        # DO NOT strip the /grafana/ prefix. Grafana is deployed with
        # serve_from_sub_path=true + root_url=.../grafana/, so it serves itself
        # UNDER /grafana/ and expects that prefix. Stripping it (the old
        # `rewrite ^/grafana/(.*) /$1 break;`) made Grafana 301-redirect to its
        # root_url — whose %(domain)s defaults to localhost — so the embedded
        # iframe bounced to http://localhost:3000/grafana/... = "connection
        # refused" in the admin's browser (proven: GET .176:3000/d/x -> 301
        # localhost, GET .176:3000/grafana/d/x -> 200). proxy_pass with a
        # variable and no URI forwards the full /grafana/... path unchanged.
        proxy_pass $grafana_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Grafana live
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Allow large Grafana responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # ==========================================
    # Qdrant Vector Database
    # ==========================================
    location /qdrant/ {
        proxy_pass http://qdrant:6333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # API key injected via envsubst at container start
        proxy_set_header api-key "${QDRANT_API_KEY}";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ==========================================
    # Orchestrator - Container management
    # ==========================================
    location /orchestrator/ {
        proxy_pass http://orchestrator:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ==========================================
    # QuoxFlow - Auditable workflow engine
    # ==========================================
    location /quoxflow/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://quoxflow:3200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # NOTE: x-service-key NOT injected here — QuoxFlow validates user JWTs directly.
        # Auto-injecting would grant service-level access to unauthenticated browser requests.

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # ==========================================
    # CoreComms Proxy Endpoints (SSRF-hardened)
    # ==========================================

    # Telegram API proxy
    location /telegram-api/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.0/8;
        deny all;

        if ($http_authorization = '') {
            return 401 '{"error": "Authentication required for proxy access"}';
        }

        limit_except GET POST {
            deny all;
        }

        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        access_log /var/log/nginx/proxy_audit.log combined;

        proxy_pass https://api.telegram.org/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.telegram.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Slack webhook proxy
    location /slack-webhook/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.0/8;
        deny all;

        if ($http_authorization = '') {
            return 401 '{"error": "Authentication required for proxy access"}';
        }

        limit_except POST {
            deny all;
        }

        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        access_log /var/log/nginx/proxy_audit.log combined;

        proxy_pass https://hooks.slack.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host hooks.slack.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ==========================================
    # Monitoring Plugin SPA Routes
    # ==========================================
    # Prevent /monitoring/* from falling through to other proxy blocks
    location /monitoring {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }

    # index.html must never be cached — it contains hashed asset references
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }

    # STUDY-REV-2 / P7.E.1 — User-owned Prompts Library (auth service)
    location /api/prompts {
        proxy_pass http://auth:3101/api/prompts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Auth service — models and consent routes
    location /api/models {
        proxy_pass http://auth:3101/api/models;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/consent {
        proxy_pass http://auth:3101/api/consent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # API catch-all — return JSON 404 for unmatched /api/ routes
    # Prevents the SPA catch-all from serving index.html for API calls
    # ==========================================
    # LIFECYCLE-P4-D4 fix: proxy /api/catalog/* (tool detail + listing) to auth
    location /api/catalog {
        proxy_pass http://auth:3101/api/catalog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RES.5 (plan/19): third-party plugin backend gateway. Same-origin HTTPS
    # path so an installed plugin's frontend can reach its backend without
    # mixed-content / cross-origin blocks. The collector (pluginGateway.js,
    # mounted at /api/v1/plugins/:pluginId/*) strips the prefix, auths, rate-
    # limits, and forwards to the plugin's registered backend container. Longer
    # prefix than /api/ below, so nginx routes it here first.
    location /api/v1/plugins/ {
        proxy_pass http://collector:9848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 35s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
    }

    # Qluster fleet poller: /api/v1/health/aggregate + /api/v1/health/resources.
    # Token-gated server-side via requireReadToken (QUOXCORE_READ_TOKEN) — safe to expose.
    # Must come before the /api/ catch-all below, which otherwise 404s these routes.
    location /api/v1/health/ {
        proxy_pass http://collector:9848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 15s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"not_found","message":"API endpoint not found"}';
    }

    # ==========================================
    # SPA routing — catch-all
    # ==========================================
    location / {
        try_files $uri /index.html;
        # For SPA fallback to index.html, prevent caching
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }
}
